services:
  - type: web
    name: flotilla-taxis-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate:deploy && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: flotilla-taxis-api
      - key: JWT_AUDIENCE
        value: flotilla-taxis-web
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: flotilla-taxis-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    autoDeployTrigger: commit
    envVars:
      - key: API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: flotilla-taxis-db
    plan: free
    region: oregon
    databaseName: flotilla_taxis
    user: flotilla_taxis
    postgresMajorVersion: "18"
